name: Exact-source regression validation
on:
  push:
    branches: ['validation/label-map-blank-lines-20260928']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JAX_PLATFORMS: cpu
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sylvesterkaczmarek/lasertagger
          ref: 'b8d61e08531ec2d44f06076a0767996aa97d252e'
          path: work
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install focused test dependencies
        run: |
          python -m venv test-env
          test-env/bin/python -m pip install tensorflow==2.15.1 numpy==1.26.4 absl-py pytest==9.1.1 pytest-cov ruff==0.16.9 yapf==0.43.0
      - name: Verify exact source and original-code controls
        run: test-env/bin/python validation/verify.py work evidence
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ matrix.python }}
          path: evidence
          retention-days: 14
